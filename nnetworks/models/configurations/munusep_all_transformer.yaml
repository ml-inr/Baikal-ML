TransformerClassifierConfig:
    encoder_config:
        in_features: 5
        encoders_number: 4
        d_model: 256
        nhead: 4
        dim_feedforward: 256
        dropout: 0.1
        layer_norm_eps: 1.0e-05
        activation:
            LeakyReLU:
                negative_slope: 0.1
    pooling_type: Max
    dense_layers:
    -   in_features: 512
        units: 128
        activation:
            LeakyReLU:
                negative_slope: 0.1
        dropout: 0.1
        do_norm: true
    -   in_features: 128
        units: 32
        activation:
            Softmax:
                dim: 1
        dropout: 0.1
        do_norm: true
    -   in_features: 32
        units: 2
        activation:
            Softmax:
                dim: 1
        dropout: 0.0
        do_norm: false

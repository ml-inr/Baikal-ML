TransformerClassifierConfig:
    encoder_config:
        in_features: 5
        encoders_number: 4
        d_model: 1024
        nhead: 8
        dim_feedforward: 1024
        dropout: 0.2
        layer_norm_eps: 1.0e-05
        activation:
            LeakyReLU:
                negative_slope: 0.1
    pooling_type: Max
    dense_layers:
    -   in_features: 2048
        units: 256
        activation:
            LeakyReLU:
                negative_slope: 0.1
        dropout: 0.1
        do_norm: true
    -   in_features: 256
        units: 32
        activation:
            LeakyReLU:
                negative_slope: 0.1
        dropout: 0.1
        do_norm: true
    -   in_features: 32
        units: 2
        activation:
            Softmax:
                dim: 1
        dropout: 0.0
        do_norm: false

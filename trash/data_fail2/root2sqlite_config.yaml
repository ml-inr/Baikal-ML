input:
  particle: "muatm"
  #MC_dir_path: "/net/62/home3/ivkhar/Baikal/data/initial_data/MC_2020/muatm/root/all"
  MC_dir_path: "/home/albert/Baikal2/data/mock_MC_2020/muatm/root/all"

root_paths:

# Pilot build of the muon-energy dataset: 50 parts per class.
# Run from the repository root:
#   CUDA_DEVICE_ORDER=PCI_BUS_ID CUDA_VISIBLE_DEVICES=1 \
#   python -m data_manager.mu_energy_ds_builder --config \
#       data_manager/mu_energy_ds_builder/pilot_config.yaml

h5_path: "data_manager/data/h5datasets/baikal_mc_merged.h5"
companion_path: "data_manager/data/h5datasets/baikal_mc_merged_energy_truth.h5"
catalog_path: "data_manager/catalog_v2.duckdb"
parts_file: "data_manager/mu_energy_ds_builder/pilot_parts.yaml"
output_dir: "data_manager/datasets/mu_energy_dataset_h8s3_thr0.8_pilot"

sig_noise_model:
  device: "cuda:0"
  batch_size: 256

sig_noise_threshold: 0.8

event_cuts:
  min_hits: 8
  min_strings: 3

target:
  # Companion column 1: r <= 90 m, |z| <= 295 m (the cluster + 30 m margin).
  column: 1
  volume_radius_m: 90
  volume_z_half_m: 295
  valid_status: [0, 1, 4, 5]
  # nuatm: the vertex cascade is not recorded, so a muon born inside the target
  # volume has a different detector response.  Exclude those rows for nuatm only.
  exclude_nuatm_born_inside: true
  born_inside_status: [1, 5]

seed: 42

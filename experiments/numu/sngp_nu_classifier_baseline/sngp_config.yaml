data:
  device: cuda:0
  include_probs: false
  max_hits: 500
  normalization:
    enabled: true
  source_domain:
    max_events: 5000000
    npy_dir: data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8
    train_split: 0.9
dataloader:
  augmentation:
    noise_std:
    - 0.05
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    rotation_enabled: true
  num_workers: 0
  pin_memory: false
debug:
  enabled: false
  max_batches_per_epoch: 10
experiment:
  description: SNGP nu-classifier, MC-supervised, SN encoder + RFF-GP head
  name: sngp_nu_classifier_baseline
  seed: 42
logging:
  level: INFO
  log_every: 50
  output_dir: experiments/numu
  save_config: true
  save_model_summary: true
  tensorboard: true
model:
  amp_clip: 100
  feature_extractor:
    d_model: 128
    dim_feedforward: 128
    dropout: 0.0
    input_dim: 5
    max_seq_len: 1000
    num_heads: 4
    num_layers: 4
    pooling: cls
    use_positional_encoding: true
  gp_head:
    length_scale: 1.0
    mean_field_factor: 0.3926990817
    normalize_input: true
    num_rff: 1024
    ridge: 0.001
  spectral_norm:
    enabled: true
  type: numu_sngp
reproducibility:
  benchmark: false
  deterministic: true
training:
  batch_size: 512
  class_weights: null
  classification_loss: focal
  early_stopping:
    enabled: true
    min_delta: 0.0
    mode: min
    monitor: val_loss
    patience: 15
  epochs: 60
  focal_gamma: 2.0
  learning_rate: 0.0001
  optimizer: adamw
  save_every: 5
  scheduler: plateau
  scheduler_params:
    factor: 0.5
    min_lr: 1.0e-06
    mode: min
    patience: 3
  validate_every: 1
  weight_decay: 0.01

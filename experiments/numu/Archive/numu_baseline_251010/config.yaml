data:
  device: cuda:1
  events_per_particle:
    muatm_2020: 300000
    nuatm_2020: 150000
    nue2_2020: 150000
  h5_path: /net/62/home3/ivkhar/Baikal/data/h5s/baikal_mc_merged.h5
  max_hits: 300
  neutrino_types:
  - nuatm_2020
  - nue2_2020
  particle_types:
  - muatm_2020
  - nuatm_2020
  - nue2_2020
  sampling_config:
    muatm_2020:
      mode: range
      start_event: 0
    nuatm_2020:
      mode: range
      start_event: 0
    nue2_2020:
      mode: range
      start_event: 0
  shuffle_events: true
  test_split: 0.0
  train_split: 0.7
  val_split: 0.3
dataloader:
  augmentation:
    enabled: false
    noise_std:
    - 0.1
    - 5.0
    - 2.0
    - 2.0
    - 5.0
    rotation_std: 1.0
  num_workers: 0
  pin_memory: false
  shuffle_train: true
  shuffle_val: false
debug:
  enabled: false
  max_batches_per_epoch: 10
  overfit_single_batch: false
experiment:
  description: Baseline attention-based model for neutrino vs muon binary classification
  mode: standard
  name: numu_baseline_251010
  seed: 42
  tags:
  - baseline
  - attention
  - binary_classification
hardware:
  compile_model: false
  mixed_precision: false
logging:
  clearml:
    enabled: true
    project_name: neutrino_detection
    task_name: null
  level: INFO
  log_every: 10
  output_dir: experiments/numu
  save_config: true
  save_model_summary: true
metrics:
- accuracy
- precision
- recall
- f1
- auc
- confusion_matrix
model:
  classifier:
    dropout: 0.1
    hidden_dims:
    - 64
    - 32
    - 16
    use_batch_norm: true
  feature_extractor:
    d_model: 256
    dim_feedforward: 512
    dropout: 0.1
    input_dim: 5
    max_seq_len: 300
    num_heads: 8
    num_layers: 4
    pooling: cls
    use_positional_encoding: true
  type: numu
reproducibility:
  benchmark: false
  deterministic: true
training:
  accumulation_steps: 1
  batch_size: 128
  class_weights: null
  early_stopping:
    enabled: true
    min_delta: 0.0001
    mode: max
    monitor: val_auc
    patience: 10
  epochs: 100
  learning_rate: 0.001
  loss: bce_with_logits
  optimizer: adamw
  save_best: true
  save_every: 5
  scheduler: cosine
  scheduler_params:
    T_max: 100
    eta_min: 1.0e-05
  validate_every: 1
  weight_decay: 0.01

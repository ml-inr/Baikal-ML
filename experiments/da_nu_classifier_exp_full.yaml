# DA nu-classifier — exp_full experiments (Options 1/2/3).
#
# BASE = Option 1 only (exp_full target, no spectral norm, no afterpulse).
# Toggle the three marked fields to build the E1..E4b matrix; sweep lambda via
# domain_adaptation.lambda_scheduler.max_lambda (0.01 / 0.1).
# See experiments/numu/exp_full_DA_experiments.md for the run matrix.
#
# Usage:
#   python src/training/da_nu_classifier_trainer.py \
#       --config experiments/da_nu_classifier_exp_full.yaml [--debug]

experiment:
  name: "da_nu_classifier_exp_full_E1_lambda0.01"   # rename per run
  description: "DA nu-classifier, full-stat exp target"
  seed: 42

reproducibility:
  deterministic: true
  benchmark: false

data:
  device: "cuda:4"
  max_hits: 500

  normalization:
    enabled: true

  include_probs: false

  source_domain:
    npy_dir: "data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8"
    max_events: 5000000
    train_split: 0.9

  # Option 1: full-statistics exp target (~5M, bad runs excluded).
  target_domain:
    npy_dir: "data_manager/datasets/nu_classifier_dataset_exp_full_thr0.8"
    max_events: 5000000
    train_split: 0.8

model:
  type: "numu"
  amp_clip: 100

  # ── OPTION 2 toggle ── spectral norm on the encoder (fights feature collapse)
  spectral_norm:
    enabled: false            # E2 / E4: true

  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 128
    dropout: 0.
    pooling: "cls"
    use_positional_encoding: true
    max_seq_len: 1000

  classifier:
    hidden_dims: [32, 16]
    dropout: 0.
    use_batch_norm: false

domain_adaptation:
  domain_discriminator:
    hidden_dims: [32, 16]
    dropout: 0.
    use_batch_norm: false
    use_gradient_reversal: true
    lambda_factor: 0.

  lambda_scheduler:
    schedule_by: "step"
    type: "progressive"
    max_lambda: 0.01          # ── LAMBDA SWEEP ── 0.01 / 0.1
    gamma: 10.0

training:
  epochs: 100
  source_batch_size: 512
  target_batch_size: 256

  classification_loss: "focal"
  focal_gamma: 2.0
  class_weights: null

  feature_optimizer:     {optimizer: "adamw", learning_rate: 0.0001, weight_decay: 0.01}
  classifier_optimizer:  {optimizer: "adamw", learning_rate: 0.0001, weight_decay: 0.01}
  discriminator_optimizer: {optimizer: "adamw", learning_rate: 0.0003, weight_decay: 0.01}

  scheduler: "plateau"
  scheduler_params: {mode: "min", factor: 0.5, patience: 3, min_lr: 1.0e-6}

  validate_every: 1
  save_every: 5

  early_stopping:
    enabled: true
    monitor: "val_loss"
    mode: "min"
    patience: 15
    min_delta: 0.

dataloader:
  num_workers: 0
  pin_memory: false

  augmentation:
    noise_std: [0.05, 5.0, 1.0, 1.0, 2.0]
    rotation_enabled: true

    # ── OPTION 3 toggle ── synthetic afterpulse into MC source only.
    # Per-event sequential draw of 1..max_afterpulses (P(1)>P(2)>P(3)).
    # prob 0.02 (3a, elevated-physical) / 0.25 (3b, robust training).
    afterpulse:
      enabled: false          # E3 / E4: true
      prob: 0.02              # 3a: 0.02 | 3b: 0.25
      max_afterpulses: 3
      q_range: [5.0, 100.0]

logging:
  level: "INFO"
  output_dir: "experiments/numu"
  log_every: 10
  tensorboard: true
  save_config: true
  save_model_summary: true

debug:
  enabled: false
  max_batches_per_epoch: 10

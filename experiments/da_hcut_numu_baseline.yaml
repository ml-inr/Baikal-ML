# Domain Adaptation Configuration for Neutrino Detection
# MC → Exp Transfer Learning using DANN (Domain-Adversarial Neural Networks)
#
# Key principles:
# - Source domain (MC): Has labels, used for classification training + validation
# - Target domain (Exp): No labels, used only for adversarial domain training
# - Validation: Only classification performance on source domain (not domain discriminator)
# - Early stopping: Based on source domain classification metrics (val_auc)

experiment:
  name: "da_hcut5_numu_260206_smallnn_bigds_middleddnoreg_0.001lambda_aug_correct"
  description: "Domain adaptation baseline using DANN for MC→Exp transfer learning"
  seed: 43

# Reproducibility settings
reproducibility:
  deterministic: true
  benchmark: false

# Data configuration for both domains
data:
  device: "cuda:0"  # "cuda" or "cpu"
  max_hits: 500
  
  # Normalization (preset from MC statistics)
  normalization:
    enabled: true
    # Uses data_manager/stats_dict/default_mc.yaml
  
  # Source domain (MC data with labels)
  source_domain:
    h5_path: "/net/62/home3/ivkhar/Baikal/data/h5s/baikal_mc_merged.h5"
    events_per_particle:
      muatm_2020: 1200000      # Atmospheric muons (background)
      nue2_2020: 600000       # Astrophysics neutrinos (signal)
      nuatm_2020: 600000       # Atmospheric neutrinos (signal)
    particle_types: ["muatm_2020", "nue2_2020", "nuatm_2020"]
    neutrino_types: ["nue2_2020", "nuatm_2020"]
    h_min_cut: 5
    train_split: 0.85
    shuffle_events: true
    balance_classes: true     # Balance signal (nuatm=nue2) and background (=total signal)
  
  # Target domain (Experimental data, no labels for validation)
  target_domain:
    h5_path: "/home/albert/Baikal2025/data_manager/h5datasets/exp.h5"
    events_per_particle:
      exp: 293332             # Experimental data
    particle_types: ["exp"]
    neutrino_types: []      # All particles assumed to be muons (background)
    # # Note: train_split removed - using entire dataset for adversarial training
    # h_min_cut: 5
    train_split: 0.85
    shuffle_events: true

# Model architecture
model:
  type: "numu"
  
  # Feature extractor (shared between domains)
  feature_extractor:
    input_dim: 5            # [amplitude, time, x, y, z]
    d_model: 64
    num_heads: 4
    num_layers: 2
    dim_feedforward: 64
    dropout: 0.
    pooling: "cls"          # "cls", "mean", "max", "attention"
    use_positional_encoding: true
    max_seq_len: 1000
  
  # Classification head
  classifier:
    hidden_dims: [32, 16]
    dropout: 0.
    use_batch_norm: false

# Domain adaptation configuration
domain_adaptation:
  # Domain discriminator configuration
  domain_discriminator:
    hidden_dims: [32, 16]
    dropout: 0.
    use_batch_norm: false
    use_gradient_reversal: true
    lambda_factor: 0.      # Initial lambda value
  
  # Lambda scheduling for gradient reversal
  lambda_scheduler:
    # type: "linear"     # "progressive", "constant", "linear"
    # start_lambda: 0.5
    # end_lambda: 5.0
    schedule_by: 'step'
    type: "progressive"
    max_lambda: 0.001       # Maximum λ value
    gamma: 10.0            # For progressive scheduling: λ = 2/(1+exp(-γ*p)) - 1, where p = epoch / total_epochs
    # type: "constant"
    # lambda: 1.       # Maximum λ value
    # # gamma: 10.0            # For

# Training configuration
training:
  epochs: 100
  # Separate batch sizes for source and target domains
  source_batch_size: 512    # MC data (mixed neutrinos + muons) - larger for better muon coverage
  target_batch_size: 256    # Exp data (all muons) - using entire dataset for adversarial training
  
  # Loss function
  loss: "bce_with_logits"
  class_weights: null      # Use calculated weights from source domain
  
  # Separate optimizers for different components
  # Feature extractor optimizer
  feature_optimizer:
    optimizer: "adamw"
    learning_rate: 0.001
    weight_decay: 0.01
  
  # Classifier optimizer
  classifier_optimizer:
    optimizer: "adamw"
    learning_rate: 0.001
    weight_decay: 0.01
  
  # Domain discriminator optimizer
  discriminator_optimizer:
    optimizer: "adamw"
    learning_rate: 0.002     # higher LR for discriminator
    weight_decay: 0.01
  
  # Learning rate scheduling
  scheduler: "cosine"
  scheduler_params:
    T_max: 100
    eta_min: 1e-6
  
  # Validation and saving
  validate_every: 1          # Validates classification performance on source domain only
  save_every: 5
  
  # Early stopping based on source domain classification performance
  early_stopping:
    enabled: true
    monitor: "val_auc"        # Source domain validation AUC (classification task)
    mode: "max"
    patience: 15
    min_delta: 0.0001

# Data loading configuration
dataloader:
  num_workers: 0
  pin_memory: False
  reshuffle_train: true
  
  # Data augmentation
  augmentation:
    noise_std: [0.05, 5.0, 1.0, 1.0, 2.0]  # Per feature: [amp, time, x, y, z]
    rotation_enabled: true                 # Uniform Rotations in [0, 2*pi] radians

# Logging and experiment tracking
logging:
  level: "INFO"
  output_dir: "experiments/numu"
  log_every: 10
  tensorboard: true
  
  save_config: true
  save_model_summary: true

# Debug mode (for testing)
debug:
  enabled: false
  max_batches_per_epoch: 10
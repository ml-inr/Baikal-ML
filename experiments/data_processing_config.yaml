experiment:
  name: "data_conversion_test"
  seed: 42

data:
  # Input ROOT files (will be updated with actual files)
  input_files: 
    - "mock_data.root"
  
  # ROOT tree configuration
  tree_name: "Events"
  
  # Branches to extract from ROOT files
  # Generic physics data branches - customize for your specific data
  branches:
    - "time"        # Time coordinate
    - "x"           # X spatial coordinate  
    - "y"           # Y spatial coordinate
    - "z"           # Z spatial coordinate
    - "amplitude"   # Signal amplitude
    - "charge"      # Electric charge
    - "energy"      # Energy measurement
    - "particle_id" # Particle type identifier
  
  # Output configuration
  output_dir: "processed_data/"
  
  # Data quality cuts (optional)
  # Customize these ranges for your specific physics data
  cuts:
    energy:
      min: 0.0
      max: 1000.0
    amplitude:
      min: 0.0
    time:
      min: 0.0
    charge:
      min: -10.0
      max: 10.0
  
  # Train/validation/test splits
  splits:
    train: 0.7
    val: 0.15
    test: 0.15
  
  # Data preprocessing options (for future expansion)
  preprocessing:
    normalize: false
    standardize: false
    remove_outliers: false
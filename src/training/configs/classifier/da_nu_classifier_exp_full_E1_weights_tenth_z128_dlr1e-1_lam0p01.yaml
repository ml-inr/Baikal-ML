# Ячейка расширения сетки «D-LR × λ» при z=128 (1/10 данных, весовой рецепт).
#
# Продолжение линии: закрывается ли разрыв «живой критик против свежего читателя»
# на очень быстрых критиках (D-LR 3e-2..2e-1) и где обрыв по λ (0.05 как 0.01 или
# как 0.03?). λ=0.2 — стресс-тест (20× стандарта). Прогноз из прошлой партии:
# изъятие насыщено на ~0.728, растёт только обман; эти ячейки проверяют, ломается
# ли закономерность на краях. Всё прочее как в сетке 1/10: веса, сид 42, max_events
# 500k, step ×0.5/8 эпох, epochs 100, ранняя остановка 15.
experiment:
  name: 261013_0610_da_nu_classifier_exp_full_E1_weights_tenth_z128_dlr1e-1_lam0p01
  description: 'D-LR x lambda extension at z=128, 1/10 data: discriminator lr=0.1,
    progressive lambda ramp, max=0.01.'
  seed: 42
reproducibility:
  deterministic: true
  benchmark: false
data:
  device: cuda:0
  include_probs: false
  max_hits: 500
  normalization:
    enabled: true
  source_domain:
    npy_dir: data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8
    max_events: 500000
    train_split: 0.9
    weights_file: data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8/weights.npy
  target_domain:
    npy_dir: data_manager/datasets/nu_classifier_dataset_exp_full_thr0.8
    max_events: 500000
    train_split: 0.8
model:
  type: numu
  amp_clip: 100
  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 128
    dropout: 0.0
    pooling: cls
    use_positional_encoding: true
    max_seq_len: 1000
  classifier:
    hidden_dims:
    - 32
    - 16
    dropout: 0.0
    use_batch_norm: false
  spectral_norm:
    enabled: false
domain_adaptation:
  domain_discriminator:
    hidden_dims:
    - 32
    - 16
    dropout: 0.0
    use_batch_norm: false
    use_gradient_reversal: true
    lambda_factor: 0.0
    hidden_layer_norm: true
    instance_noise: 0.05
  discriminator_refresh:
    every_epochs: 5
    steps: 300
  lambda_scheduler:
    schedule_by: step
    type: progressive
    max_lambda: 0.01
    gamma: 10.0
training:
  epochs: 100
  source_batch_size: 512
  target_batch_size: 256
  classification_loss: focal
  focal_gamma: 2.0
  feature_optimizer:
    optimizer: adamw
    learning_rate: 0.0001
    weight_decay: 0.01
  classifier_optimizer:
    optimizer: adamw
    learning_rate: 0.0001
    weight_decay: 0.01
  discriminator_optimizer:
    optimizer: adamw
    learning_rate: 0.1
    weight_decay: 0.01
  scheduler: step
  scheduler_params:
    step_size: 8
    gamma: 0.5
  validate_every: 1
  save_every: 5
  invariance_probe:
    enabled: true
    path: data_manager/probe_sample/probe_sample.npz
    every_n_epochs: 1
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 15
    min_delta: 0.0
dataloader:
  num_workers: 0
  pin_memory: false
  augmentation:
    noise_std:
    - 0.05
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    rotation_enabled: true
    afterpulse:
      enabled: false
      prob: 0.02
      max_afterpulses: 3
      q_range:
      - 5.0
      - 100.0
logging:
  level: INFO
  output_dir: trained_models/classifier
  log_every: 10
  tensorboard: true
  save_config: true
  save_model_summary: true
debug:
  enabled: false
  max_batches_per_epoch: 10

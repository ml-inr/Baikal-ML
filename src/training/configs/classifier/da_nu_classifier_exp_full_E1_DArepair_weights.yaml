# DA-repair + per-event reweighting (energy and zenith flattened within class).
#
# Purpose: the exp excess is a *content* mismatch (charge ratio, timing spread),
# and part of it is class-correlated nuisance — the MC neutrino samples are
# spectrally harder and lie in a different zenith band than the muon sample, so
# "bright" and "near-horizon" are partly class cues the model is free to use.
# This run removes that prior from the loss: each event carries a weight that
# flattens ln E and cos(theta) within its class (weights built by
# data_manager/nu_classifier_ds_builder/add_weights.py, clipped at 20x the mean).
#
# Seed stays 42 so that the comparison against 261002_0535 (same seed, no
# weights) isolates the reweighting. The seed effect is measured separately by
# ..._DArepair_seed27.
experiment:
  name: 261002_0804_da_nu_classifier_exp_full_E1_lambda0.01_DArepair_weights
  description: >
    DA-repair run with per-event weights flattening ln E and cos(theta) within
    each class (clipped importance weighting, max 20x mean). Same seed and
    recipe as 261002_0535 otherwise: neutrinos stay in the domain term.
  seed: 42

reproducibility:
  deterministic: true
  benchmark: false

data:
  device: cuda:3
  include_probs: false
  max_hits: 500

  normalization:
    enabled: true

  source_domain:
    npy_dir: data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8
    max_events: 5000000
    train_split: 0.9
    # Per-event weights: uniform in ln E and in cos(theta) within each class.
    # Only this config names the file, so no other run changes behaviour.
    weights_file: data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8/weights.npy

  target_domain:
    npy_dir: data_manager/datasets/nu_classifier_dataset_exp_full_thr0.8
    max_events: 5000000
    train_split: 0.8

model:
  type: numu
  amp_clip: 100
  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 128
    dropout: 0.0
    pooling: cls
    use_positional_encoding: true
    max_seq_len: 1000
  classifier:
    hidden_dims: [32, 16]
    dropout: 0.0
    use_batch_norm: false
  spectral_norm:
    enabled: false

domain_adaptation:
  domain_discriminator:
    hidden_dims: [32, 16]
    dropout: 0.0
    use_batch_norm: false
    use_gradient_reversal: true
    lambda_factor: 0.
    hidden_layer_norm: true     # per-sample LayerNorm after each hidden Linear
    instance_noise: 0.05        # std of input noise, training only
  discriminator_refresh:
    every_epochs: 5
    steps: 300
  lambda_scheduler:
    schedule_by: "step"
    type: "progressive"
    max_lambda: 0.01
    gamma: 10.0

training:
  epochs: 100
  source_batch_size: 512
  target_batch_size: 256
  classification_loss: "focal"
  focal_gamma: 2.0
  feature_optimizer:     {optimizer: "adamw", learning_rate: 0.0001, weight_decay: 0.01}
  classifier_optimizer:  {optimizer: "adamw", learning_rate: 0.0001, weight_decay: 0.01}
  discriminator_optimizer: {optimizer: "adamw", learning_rate: 0.0003, weight_decay: 0.01}
  scheduler: "plateau"
  scheduler_params: {mode: "min", factor: 0.5, patience: 3, min_lr: 1.0e-6}
  validate_every: 1
  save_every: 5
  invariance_probe:
    enabled: true
    path: "data_manager/probe_sample/probe_sample.npz"
    every_n_epochs: 1
  early_stopping:
    enabled: true
    monitor: "val_loss"
    mode: "min"
    patience: 15
    min_delta: 0.

dataloader:
  num_workers: 0
  pin_memory: false
  augmentation:
    noise_std: [0.05, 5.0, 1.0, 1.0, 2.0]
    rotation_enabled: true
    afterpulse:
      enabled: false
      prob: 0.02
      max_afterpulses: 3
      q_range: [5.0, 100.0]

logging:
  level: "INFO"
  output_dir: "trained_models/classifier"
  log_every: 10
  tensorboard: true
  save_config: true
  save_model_summary: true

debug:
  enabled: false
  max_batches_per_epoch: 10

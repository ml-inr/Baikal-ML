# DA-repair control run: FIXED_sn256 settings + a fix for the discriminator
# degeneration measured on that checkpoint.
#
# Diagnosis (inference/nu_classifier/analysis/da_band_probe/README.md): the
# FIXED_sn256 discriminator ended the run unable to separate the domains at all
# (its own val AUC ~0.52) although a fresh logistic probe on the same frozen
# features separates them at 0.70-0.78. Same architecture, given 800 steps of
# plain BCE on those features, recovers to AUC 0.72 -- so the state was produced
# by the adversarial dynamics, and while it lasted the reversal gradient to the
# encoder was ~zero.
#
# This run is a *control*: everything else stays FIXED (same datasets, seed,
# losses, lambda=0.01); neutrinos are deliberately kept in the domain term
# (owner's decision, 2026-10-02) so the only change is the repair. The new
# independent invariance probe measures whether the domain branch does anything
# at all, which the domain loss alone cannot tell.
experiment:
  name: 261002_0535_da_nu_classifier_exp_full_E1_lambda0.01_DArepair
  description: >
    E1 control run with the discriminator-degeneration fix: hidden-layer
    LayerNorm and instance noise in the discriminator, plus a periodic refresh
    of the discriminator on frozen features. Neutrinos stay in the domain
    term. Adds the independent invariance probe (fresh logistic probe on
    frozen features of a fixed held-out sample) to the epoch metrics.
  seed: 42

reproducibility:
  deterministic: true
  benchmark: false

data:
  device: cuda:0
  include_probs: false
  max_hits: 500

  normalization:
    enabled: true

  source_domain:
    npy_dir: data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8
    max_events: 5000000
    train_split: 0.9

  target_domain:
    npy_dir: data_manager/datasets/nu_classifier_dataset_exp_full_thr0.8
    max_events: 5000000
    train_split: 0.8

model:
  type: numu
  amp_clip: 100
  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 128
    dropout: 0.0
    pooling: cls
    use_positional_encoding: true
    max_seq_len: 1000
  classifier:
    hidden_dims: [32, 16]
    dropout: 0.0
    use_batch_norm: false
  spectral_norm:
    enabled: false

domain_adaptation:
  domain_discriminator:
    hidden_dims: [32, 16]
    dropout: 0.0
    use_batch_norm: false
    use_gradient_reversal: true
    lambda_factor: 0.
    # ── the repair ──
    hidden_layer_norm: true     # per-sample LayerNorm after each hidden Linear
    instance_noise: 0.05        # std of input noise, training only
  # ── the repair ── re-fit the discriminator alone on frozen features every N
  # epochs, so the game resumes with a live opponent instead of an uninformative
  # one (grader must keep grading).
  discriminator_refresh:
    every_epochs: 5
    steps: 300
  lambda_scheduler:
    schedule_by: "step"
    type: "progressive"
    max_lambda: 0.01
    gamma: 10.0

training:
  epochs: 100
  source_batch_size: 512
  target_batch_size: 256
  classification_loss: "focal"
  focal_gamma: 2.0
  feature_optimizer:     {optimizer: "adamw", learning_rate: 0.0001, weight_decay: 0.01}
  classifier_optimizer:  {optimizer: "adamw", learning_rate: 0.0001, weight_decay: 0.01}
  discriminator_optimizer: {optimizer: "adamw", learning_rate: 0.0003, weight_decay: 0.01}
  scheduler: "plateau"
  scheduler_params: {mode: "min", factor: 0.5, patience: 3, min_lr: 1.0e-6}
  validate_every: 1
  save_every: 5
  # Independent invariance meter: fixed held-out sample (out-of-training MC
  # muons vs exp holdout, tail-enriched; built by
  # data_manager/probe_sample/build_probe_sample.py).
  invariance_probe:
    enabled: true
    path: "data_manager/probe_sample/probe_sample.npz"
    every_n_epochs: 1
  early_stopping:
    enabled: true
    monitor: "val_loss"
    mode: "min"
    patience: 15
    min_delta: 0.

dataloader:
  num_workers: 0
  pin_memory: false
  augmentation:
    noise_std: [0.05, 5.0, 1.0, 1.0, 2.0]
    rotation_enabled: true
    afterpulse:
      enabled: false
      prob: 0.02
      max_afterpulses: 3
      q_range: [5.0, 100.0]

logging:
  level: "INFO"
  output_dir: "trained_models/classifier"
  log_every: 10
  tensorboard: true
  save_config: true
  save_model_summary: true

debug:
  enabled: false
  max_batches_per_epoch: 10

experiment:
  id: B-T5
  name: 261027_0935_mu_energy_B-T5_partsplit_scratch_s42
  description: 'B-T5: corrected NLL scale, joint full sigma, student_t'
  seed: 42
reproducibility:
  deterministic: true
data:
  device: cuda:0
  npy_dir: data_manager/datasets/mu_energy_dataset_h8s3_thr0.8_train1M_partsplit
  max_hits: 500
  train_split: 0.9
  split_seed: 42
  normalization:
    enabled: true
    stats_file: data_manager/stats_dict/default_mc.yaml
  target_normalization:
    enabled: true
    mode: uniform_minmax_train
    min: -0.614567
    max: 7.985914
    mean: 3.685674
    std: 2.482745
  calibration_fraction: 0.2
model:
  type: mu_energy
  amp_clip: 100
  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 256
    dropout: 0.1
    pooling: cls
    use_positional_encoding: true
    max_seq_len: 1000
  regressor:
    hidden_dims:
    - 64
    dropout: 0.1
  heteroscedastic:
    enabled: true
    distribution: student_t
    student_t_nu: 5.0
    hidden_dims:
    - 64
    dropout: 0.1
    init_sigma_dex: 0.5
    sigma_min_dex: 0.05
    sigma_max_dex: 5.0
    beta_nll: 0.0
    warmup_epochs: 2
    warmup_loss: huber
training:
  epochs: 100
  batch_size: 256
  loss:
    name: gaussian_nll
    huber_delta: 0.5
  optimizer:
    name: adamw
    learning_rate: 0.0005
    weight_decay: 0.01
  scheduler:
    name: plateau
    params:
      mode: min
      factor: 0.5
      patience: 4
      threshold: 0.0001
      threshold_mode: rel
      cooldown: 2
      min_lr: 1.0e-06
      eps: 1.0e-08
  amp: false
  grad_clip: 1.0
  validate_every: 1
  save_every: 5
  early_stopping:
    enabled: false
    monitor: val_mae_log10
    patience: 20
    min_delta: 0.001
  sigma_strategy: joint
dataloader:
  num_workers: 4
  pin_memory: true
  shuffle_batch: false
  augmentation:
    rotation_enabled: true
    zflip_enabled: true
    zflip_prob: 0.5
    noise_std:
    - 0.2
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    noise_truncate_sigma: 3.0
logging:
  level: INFO
  output_dir: trained_models/track_energy_reconstruction
  log_every: 50
  tensorboard: true
  save_config: true
  save_model_summary: true
debug:
  enabled: false
  max_batches_per_epoch: 10
  max_val_batches: 10

experiment:
  id: AH-G
  name: 261027_0935_mu_energy_AH-G_abase_s42
  description: 'AH-G: frozen DA base A, head-only gaussian sigma'
  seed: 42
reproducibility:
  deterministic: true
data:
  device: cuda:0
  npy_dir: data_manager/datasets/mu_energy_dataset_h8s3_thr0.8_train1M_partsplit
  max_hits: 500
  train_split: 0.9
  split_seed: 42
  normalization:
    enabled: true
    stats_file: data_manager/stats_dict/default_mc.yaml
  target_normalization:
    enabled: true
    mode: uniform_minmax_train
    min: -0.614567
    max: 7.985914
    mean: 3.685674
    std: 2.482745
  calibration_fraction: 0.2
model:
  type: mu_energy
  amp_clip: 100
  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 256
    dropout: 0.1
    pooling: cls
    use_positional_encoding: true
    max_seq_len: 1000
  regressor:
    hidden_dims:
    - 64
    dropout: 0.1
  heteroscedastic:
    enabled: true
    distribution: gaussian
    hidden_dims:
    - 64
    dropout: 0.1
    init_sigma_dex: 0.5
    sigma_min_dex: 0.05
    sigma_max_dex: 5.0
    beta_nll: 0.0
    warmup_epochs: 0
    warmup_loss: huber
training:
  epochs: 40
  batch_size: 256
  loss:
    name: gaussian_nll
    huber_delta: 0.5
  optimizer:
    name: adamw
    learning_rate: 0.0005
    weight_decay: 0.01
  scheduler:
    name: plateau
    params:
      mode: min
      factor: 0.5
      patience: 4
      threshold: 0.0001
      threshold_mode: rel
      cooldown: 2
      min_lr: 1.0e-06
      eps: 1.0e-08
  amp: false
  grad_clip: 1.0
  validate_every: 1
  save_every: 5
  early_stopping:
    enabled: true
    monitor: val_unc_nll
    patience: 10
    min_delta: 0.0005
  sigma_strategy: frozen
dataloader:
  num_workers: 4
  pin_memory: true
  shuffle_batch: false
  augmentation: null
logging:
  level: INFO
  output_dir: trained_models/track_energy_reconstruction
  log_every: 50
  tensorboard: true
  save_config: true
  save_model_summary: true
debug:
  enabled: false
  max_batches_per_epoch: 10
  max_val_batches: 10
resume:
  from_checkpoint: trained_models/track_energy_reconstruction/261026_2057_mu_energy_A_lam0p01_detachedcritic_partsplit_scratch_s42/best_model.pth
  load_optimizer: false
  load_scheduler: false
  reset_training_state: true

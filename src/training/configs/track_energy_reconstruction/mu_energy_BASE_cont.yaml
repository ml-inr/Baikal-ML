experiment:
  id: BASE
  name: 261027_0935_mu_energy_BASE_cont_partsplit_s42
  description: 'BASE continuation from D0 best: Huber mean, no sigma, plateau stop'
  seed: 42
reproducibility:
  deterministic: true
data:
  device: cuda:0
  npy_dir: data_manager/datasets/mu_energy_dataset_h8s3_thr0.8_train1M_partsplit
  max_hits: 500
  train_split: 0.9
  split_seed: 42
  normalization:
    enabled: true
    stats_file: data_manager/stats_dict/default_mc.yaml
  target_normalization:
    enabled: true
    mode: uniform_minmax_train
    min: -0.614567
    max: 7.985914
    mean: 3.685674
    std: 2.482745
  calibration_fraction: 0.2
model:
  type: mu_energy
  amp_clip: 100
  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 256
    dropout: 0.1
    pooling: cls
    use_positional_encoding: true
    max_seq_len: 1000
  regressor:
    hidden_dims:
    - 64
    dropout: 0.1
training:
  epochs: 150
  batch_size: 256
  loss:
    name: huber
    huber_delta: 0.5
  optimizer:
    name: adamw
    learning_rate: 3.0e-05
    weight_decay: 0.01
  scheduler:
    name: plateau
    params:
      mode: min
      factor: 0.5
      patience: 4
      threshold: 0.0001
      threshold_mode: rel
      cooldown: 2
      min_lr: 1.0e-06
      eps: 1.0e-08
  amp: false
  grad_clip: 1.0
  validate_every: 1
  save_every: 5
  early_stopping:
    enabled: true
    monitor: val_mae_log10
    patience: 12
    min_delta: 0.001
dataloader:
  num_workers: 4
  pin_memory: true
  shuffle_batch: false
  augmentation:
    rotation_enabled: true
    zflip_enabled: true
    zflip_prob: 0.5
    noise_std:
    - 0.2
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    noise_truncate_sigma: 3.0
logging:
  level: INFO
  output_dir: trained_models/track_energy_reconstruction
  log_every: 50
  tensorboard: true
  save_config: true
  save_model_summary: true
debug:
  enabled: false
  max_batches_per_epoch: 10
  max_val_batches: 10
resume:
  from_checkpoint: trained_models/track_energy_reconstruction/261026_1922_mu_energy_baseline_partsplit_scratch_s42/best_model.pth
  load_optimizer: true
  load_scheduler: false
  reset_training_state: false

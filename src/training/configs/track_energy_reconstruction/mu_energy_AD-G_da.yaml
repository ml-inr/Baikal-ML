experiment:
  id: AD-G
  name: 261027_0935_mu_energy_AD-G_partsplit_scratch_s42
  description: 'AD-G: DA + detach sigma, gaussian NLL'
  seed: 42
reproducibility:
  deterministic: true
data:
  device: cuda:0
  npy_dir: data_manager/datasets/mu_energy_dataset_h8s3_thr0.8_train1M_partsplit
  max_hits: 500
  train_split: 0.9
  split_seed: 42
  normalization:
    enabled: true
    stats_file: data_manager/stats_dict/default_mc.yaml
  target_normalization:
    enabled: true
    mode: uniform_minmax_train
    min: -0.614567
    max: 7.985914
    mean: 3.685674
    std: 2.482745
  calibration_fraction: 0.2
model:
  type: mu_energy
  amp_clip: 100
  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 256
    dropout: 0.1
    pooling: cls
    use_positional_encoding: true
    max_seq_len: 1000
  regressor:
    hidden_dims:
    - 64
    dropout: 0.1
  heteroscedastic:
    enabled: true
    distribution: gaussian
    hidden_dims:
    - 64
    dropout: 0.1
    init_sigma_dex: 0.5
    sigma_min_dex: 0.05
    sigma_max_dex: 5.0
    beta_nll: 0.0
    warmup_epochs: 2
    warmup_loss: huber
training:
  epochs: 100
  batch_size: 256
  loss:
    name: gaussian_nll
    huber_delta: 0.5
  optimizer:
    name: adamw
    learning_rate: 0.0005
    weight_decay: 0.01
  scheduler:
    name: plateau
    params:
      mode: min
      factor: 0.5
      patience: 4
      threshold: 0.0001
      threshold_mode: rel
      cooldown: 2
      min_lr: 1.0e-06
      eps: 1.0e-08
  amp: false
  grad_clip: 1.0
  validate_every: 1
  save_every: 5
  early_stopping:
    enabled: false
    monitor: val_mae_log10
    patience: 20
    min_delta: 0.001
  sigma_strategy: detach
  sigma_optimizer:
    name: adamw
    learning_rate: 0.0005
    weight_decay: 0.01
dataloader:
  num_workers: 4
  pin_memory: true
  shuffle_batch: false
  augmentation:
    rotation_enabled: true
    zflip_enabled: true
    zflip_prob: 0.5
    noise_std:
    - 0.2
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    noise_truncate_sigma: 3.0
logging:
  level: INFO
  output_dir: trained_models/track_energy_reconstruction
  log_every: 50
  tensorboard: true
  save_config: true
  save_model_summary: true
debug:
  enabled: false
  max_batches_per_epoch: 10
  max_val_batches: 10
domain_adaptation:
  enabled: true
  split_seed: 42
  source_da:
    npy_dir: data_manager/datasets/nu_classifier_dataset_h8s3_thr0.8
    layout: mc_classifier
    particle_types:
    - 0
    max_events: 1000000
    batch_size: 512
    probe_fraction: 0.1
  target_da:
    npy_dir: data_manager/datasets/nu_classifier_dataset_exp_full_h8s3_thr0.8
    layout: exp_full
    prefix: exp
    max_events: 1000000
    batch_size: 256
    holdout_fraction: 0.2
  discriminator:
    hidden_dims:
    - 128
    - 128
    dropout: 0.1
    use_batch_norm: false
    hidden_layer_norm: true
  grl:
    warmup_epochs: 5.0
    ramp_epochs: 0.0
    max_lambda: 0.01
    grl_lambda: 1.0
  critic:
    steps: 1
    lr: 0.001
    update_on_adversarial: false
  probe:
    every_n_epochs: 1
    max_events: 5000
    seed: 42
    mlp_enabled: true
    mlp_hidden:
    - 128
    mlp_max_iter: 200
  discriminator_refresh:
    every_epochs: 0
    steps: 0

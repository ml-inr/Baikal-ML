experiment:
  name: 261026_1710_mu_energy_AB_lam0p03_critlr0p001_student_t_nu5_partsplit_s42
  description: '20-epoch A+B on the part-holdout train set: DA lambda=0.03 + Student-t
    nu=5'
  seed: 42
reproducibility:
  deterministic: true
data:
  device: cuda:0
  npy_dir: data_manager/datasets/mu_energy_dataset_h8s3_thr0.8_train1M_partsplit
  max_hits: 500
  train_split: 0.9
  split_seed: 42
  normalization:
    enabled: true
    stats_file: data_manager/stats_dict/default_mc.yaml
  target_normalization:
    enabled: true
    mode: uniform_minmax_train
    min: -0.614567
    max: 7.985914
    mean: 3.685674
    std: 2.482745
  calibration_fraction: 0.2
model:
  type: mu_energy
  amp_clip: 100
  feature_extractor:
    input_dim: 5
    d_model: 128
    num_heads: 4
    num_layers: 4
    dim_feedforward: 256
    dropout: 0.1
    pooling: cls
    use_positional_encoding: true
    max_seq_len: 1000
  regressor:
    hidden_dims:
    - 64
    dropout: 0.1
  heteroscedastic:
    enabled: true
    distribution: student_t
    student_t_nu: 5.0
    hidden_dims:
    - 64
    dropout: 0.1
    init_sigma_dex: 0.5
    sigma_min_dex: 0.05
    sigma_max_dex: 5.0
    beta_nll: 0.0
    warmup_epochs: 2
    warmup_loss: huber
resume:
  from_checkpoint: trained_models/track_energy_reconstruction/261023_2037_mu_energy_h8s3_d128_l4_flat1M_znorm_zflip_noise_fixedsched_cont_s42/best_model.pth
  load_optimizer: false
  load_scheduler: false
training:
  epochs: 164
  batch_size: 256
  loss:
    name: gaussian_nll
    huber_delta: 0.5
  optimizer:
    name: adamw
    learning_rate: 6.25e-05
    weight_decay: 0.01
  scheduler:
    name: none
  amp: false
  grad_clip: 1.0
  validate_every: 1
  save_every: 5
  early_stopping:
    enabled: false
    monitor: val_unc_nll
    patience: 20
    min_delta: 0.0001
dataloader:
  num_workers: 4
  pin_memory: true
  shuffle_batch: false
  augmentation:
    rotation_enabled: true
    zflip_enabled: true
    zflip_prob: 0.5
    noise_std:
    - 0.2
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    noise_truncate_sigma: 3.0
logging:
  level: INFO
  output_dir: trained_models/track_energy_reconstruction
  log_every: 50
  tensorboard: true
  save_config: true
  save_model_summary: true
debug:
  enabled: false
  max_batches_per_epoch: 10
  max_val_batches: 10
domain_adaptation:
  enabled: true
  split_seed: 42
  source_da:
    npy_dir: data_manager/datasets/nu_classifier_dataset_h8s3_thr0.8
    layout: mc_classifier
    particle_types:
    - 0
    max_events: 1000000
    batch_size: 512
    probe_fraction: 0.1
  target_da:
    npy_dir: data_manager/datasets/nu_classifier_dataset_exp_full_h8s3_thr0.8
    layout: exp_full
    prefix: exp
    max_events: 1000000
    batch_size: 256
    holdout_fraction: 0.2
  discriminator:
    hidden_dims:
    - 128
    - 128
    dropout: 0.1
    use_batch_norm: false
    hidden_layer_norm: true
  grl:
    warmup_epochs: 2.0
    ramp_epochs: 0.0
    max_lambda: 0.03
    grl_lambda: 1.0
  critic:
    steps: 0
    lr: 0.001
    update_on_adversarial: true
  probe:
    every_n_epochs: 1
    max_events: 5000
    seed: 42
    mlp_enabled: true
    mlp_hidden:
    - 128
    mlp_max_iter: 200
  discriminator_refresh:
    every_epochs: 0
    steps: 0

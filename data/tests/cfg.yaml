    lookforward: 10000
    processor_cfg:
        has_signal_flg: true
        only_signal: false
        min_sig_hits: 0
        min_sig_strings: 0
        min_Q: 0.0
        center_times: true
        relative_coords: true
        to_calculate_tres: false
        t_threshold: 100000.0

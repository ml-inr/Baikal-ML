data:
  device: cuda:2
  include_probs: false
  max_hits: 500
  normalization:
    enabled: true
  source_domain:
    max_events: 5000000
    npy_dir: data_manager/datasets/nu_classifier_dataset_h8s3_thr0.8
    train_split: 0.9
    weights_file: data_manager/datasets/nu_classifier_dataset_h8s3_thr0.8/weights_raking.npy
  target_domain:
    max_events: 5000000
    npy_dir: data_manager/datasets/nu_classifier_dataset_exp_full_h8s3_thr0.8
    train_split: 0.8
dataloader:
  augmentation:
    afterpulse:
      enabled: false
      max_afterpulses: 3
      prob: 0.02
      q_range:
      - 5.0
      - 100.0
    noise_std:
    - 0.05
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    rotation_enabled: true
  num_workers: 0
  pin_memory: false
debug:
  enabled: false
  max_batches_per_epoch: 10
domain_adaptation:
  discriminator_refresh:
    every_epochs: 5
    steps: 300
  domain_discriminator:
    dropout: 0.0
    hidden_dims:
    - 32
    - 16
    hidden_layer_norm: true
    instance_noise: 0.05
    lambda_factor: 0.0
    use_batch_norm: false
    use_gradient_reversal: true
  lambda_scheduler:
    lambda: 0.003
    start_epoch: 2
    type: delayed_constant
experiment:
  description: 'h8s3 A/B: 8-3 cut dataset, binary balance, standard DA (lambda=0.003,
    dlr=0.01, K=10). Early stopping disabled, 50 epochs, save every epoch.'
  name: 261024_1202_da_nu_classifier_exp_full_E1_weights_z128_k10_dlr1e-2_lam0p003_delay2_h8s3_s42
  seed: 42
logging:
  level: INFO
  log_every: 10
  output_dir: trained_models/classifier
  save_config: true
  save_model_summary: true
  tensorboard: true
model:
  amp_clip: 100
  classifier:
    dropout: 0.0
    hidden_dims:
    - 32
    - 16
    use_batch_norm: false
  feature_extractor:
    d_model: 128
    dim_feedforward: 128
    dropout: 0.0
    input_dim: 5
    max_seq_len: 1000
    num_heads: 4
    num_layers: 4
    pooling: cls
    use_positional_encoding: true
  spectral_norm:
    enabled: false
  type: numu
reproducibility:
  benchmark: false
  deterministic: true
training:
  classification_loss: focal
  classifier_optimizer:
    learning_rate: 0.0001
    optimizer: adamw
    weight_decay: 0.01
  discriminator_optimizer:
    learning_rate: 0.01
    optimizer: adamw
    weight_decay: 0.0
  early_stopping:
    enabled: false
    min_delta: 0.0
    mode: min
    monitor: val_loss
    patience: 5
  epochs: 50
  feature_optimizer:
    learning_rate: 0.0001
    optimizer: adamw
    weight_decay: 0.0
  focal_gamma: 2.0
  invariance_probe:
    enabled: true
    every_n_epochs: 1
    path: data_manager/probe_sample/probe_sample.npz
  k_steps: 10
  save_every: 1
  scheduler: plateau
  scheduler_discriminator: null
  scheduler_params:
    factor: 0.5
    min_lr: 1.0e-06
    mode: min
    patience: 3
  source_batch_size: 512
  target_batch_size: 256
  validate_every: 1

data:
  device: cuda:0
  include_probs: false
  max_hits: 500
  normalization:
    enabled: true
  source_domain:
    max_events: 5000000
    npy_dir: data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8
    train_split: 0.9
  target_domain:
    max_events: 5000000
    npy_dir: data_manager/datasets/nu_classifier_dataset_exp_full_thr0.8
    train_split: 0.8
dataloader:
  augmentation:
    afterpulse:
      enabled: false
      max_afterpulses: 3
      prob: 0.02
      q_range:
      - 5.0
      - 100.0
    noise_std:
    - 0.05
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    rotation_enabled: true
  num_workers: 0
  pin_memory: false
debug:
  enabled: false
  max_batches_per_epoch: 10
domain_adaptation:
  discriminator_refresh:
    every_epochs: 5
    steps: 300
  domain_discriminator:
    dropout: 0.0
    hidden_dims:
    - 32
    - 16
    hidden_layer_norm: true
    instance_noise: 0.05
    lambda_factor: 0.0
    use_batch_norm: false
    use_gradient_reversal: true
  lambda_scheduler:
    gamma: 10.0
    max_lambda: 0.01
    schedule_by: step
    type: progressive
experiment:
  description: 'E1 control run with the discriminator-degeneration fix: hidden-layer
    LayerNorm and instance noise in the discriminator, plus a periodic refresh of
    the discriminator on frozen features. Neutrinos stay in the domain term. Adds
    the independent invariance probe (fresh logistic probe on frozen features of a
    fixed held-out sample) to the epoch metrics.

    '
  name: 261002_0535_da_nu_classifier_exp_full_E1_lambda0.01_DArepair
  seed: 42
logging:
  level: INFO
  log_every: 10
  output_dir: trained_models/classifier
  save_config: true
  save_model_summary: true
  tensorboard: true
model:
  amp_clip: 100
  classifier:
    dropout: 0.0
    hidden_dims:
    - 32
    - 16
    use_batch_norm: false
  feature_extractor:
    d_model: 128
    dim_feedforward: 128
    dropout: 0.0
    input_dim: 5
    max_seq_len: 1000
    num_heads: 4
    num_layers: 4
    pooling: cls
    use_positional_encoding: true
  spectral_norm:
    enabled: false
  type: numu
reproducibility:
  benchmark: false
  deterministic: true
training:
  classification_loss: focal
  classifier_optimizer:
    learning_rate: 0.0001
    optimizer: adamw
    weight_decay: 0.01
  discriminator_optimizer:
    learning_rate: 0.0003
    optimizer: adamw
    weight_decay: 0.01
  early_stopping:
    enabled: true
    min_delta: 0.0
    mode: min
    monitor: val_loss
    patience: 15
  epochs: 100
  feature_optimizer:
    learning_rate: 0.0001
    optimizer: adamw
    weight_decay: 0.01
  focal_gamma: 2.0
  invariance_probe:
    enabled: true
    every_n_epochs: 1
    path: inference/nu_classifier/analysis/da_band_probe/probe_sample.npz
  save_every: 5
  scheduler: plateau
  scheduler_params:
    factor: 0.5
    min_lr: 1.0e-06
    mode: min
    patience: 3
  source_batch_size: 512
  target_batch_size: 256
  validate_every: 1

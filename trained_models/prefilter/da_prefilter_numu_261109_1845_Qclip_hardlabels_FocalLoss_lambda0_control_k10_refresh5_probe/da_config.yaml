data:
  device: cuda:5
  max_hits: 500
  normalization:
    enabled: true
  source_domain:
    max_events: 2000000
    npy_dir: /home/albert/Baikal2025/data_manager/datasets/baikal_mc2020_prefilter/hard_nu_labels
    sequential_read: true
    train_split: 0.95
  target_domain:
    h5_path: /home/albert/Baikal2025/data_manager/data/h5datasets/exp.h5
    max_events: 400000
    train_split: 0.9
dataloader:
  augmentation:
    noise_std:
    - 0.05
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    rotation_enabled: true
  num_workers: 0
  pin_memory: false
debug:
  enabled: false
  max_batches_per_epoch: 10
domain_adaptation:
  discriminator_refresh:
    every_epochs: 5
    steps: 300
  domain_discriminator:
    dropout: 0.0
    hidden_dims:
    - 32
    - 16
    hidden_layer_norm: true
    instance_noise: 0.05
    lambda_factor: 0.0
    use_batch_norm: false
    use_gradient_reversal: true
  domain_source: muatm
  lambda_scheduler:
    lambda: 0.0
    type: constant
experiment:
  description: 'lambda=0 no-DANN control: same data/model/k_steps/refresh/probe as
    the muatm-only DA-repair run, adversarial encoder gradient disabled.'
  name: da_prefilter_numu_261109_1845_Qclip_hardlabels_FocalLoss_lambda0_control_k10_refresh5_probe
  seed: 42
logging:
  level: INFO
  log_every: 10
  output_dir: trained_models/prefilter
  save_config: true
  save_model_summary: true
  tensorboard: true
model:
  amp_clip: 100
  classifier:
    dropout: 0.0
    hidden_dims:
    - 32
    - 16
    use_batch_norm: false
  feature_extractor:
    d_model: 128
    dim_feedforward: 128
    dropout: 0.0
    input_dim: 5
    max_seq_len: 1000
    num_heads: 4
    num_layers: 4
    pooling: cls
    use_positional_encoding: true
  type: numu
reproducibility:
  benchmark: false
  deterministic: true
training:
  class_weights: null
  classification_loss: focal
  classifier_optimizer:
    learning_rate: 0.0001
    optimizer: adamw
    weight_decay: 0.01
  discriminator_optimizer:
    learning_rate: 0.01
    optimizer: adamw
    weight_decay: 0.0
  early_stopping:
    enabled: false
    min_delta: 0.0
    mode: min
    monitor: val_loss
    patience: 5
  epochs: 50
  feature_optimizer:
    learning_rate: 0.0001
    optimizer: adamw
    weight_decay: 0.0
  focal_gamma: 2.0
  invariance_probe:
    enabled: true
    every_n_epochs: 1
    path: data_manager/probe_sample/probe_sample_prefilter.npz
  k_steps: 10
  save_every: 1
  scheduler: plateau
  scheduler_discriminator: null
  scheduler_params:
    factor: 0.5
    min_lr: 1.0e-06
    mode: min
    patience: 3
  source_batch_size: 512
  target_batch_size: 256
  validate_every: 1

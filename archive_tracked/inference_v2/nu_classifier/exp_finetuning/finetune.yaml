pretrained_checkpoint: experiments/numu/260508_1724_da_nu_classifier_h5s0_lambda0.01_thr0.8_seed32/best_da_model.pth
mc_npy_dir:   data_manager/datasets/nu_classifier_dataset_h5s0_thr0.8
exp_bg_npy_dir: inference_v2/nu_classifier/exp_finetuning/exp_bg_datasets/260508_1724_da_nu_classifier_h5s0_lambda0.01_thr0.8_seed32@best_da_model_lt0p1
output_dir:   inference_v2/nu_classifier/exp_finetuning/finetuned_models_LARGETAUG
experiment_name: 260508_1724_da_nu_classifier_h5s0_lambda0.01_thr0.8_seed32@best_da_model_finetuned
device: cuda:2

seed: 42
max_hits: 500
mc_train_split: 0.9
bg_train_split: 0.8

epochs: 10
batch_size: 512
validate_every: 1
save_every: 1
save_epoch_checkpoints: true
log_every: 50

learning_rate: 5e-5
weight_decay:  0.01
scheduler: plateau
scheduler_params:
  mode: min
  patience: 3
  factor: 0.5
  min_lr: 1.0e-7

classification_loss: focal
focal_gamma: 2.0
class_weights: true

early_stopping:
  enabled: true
  monitor: loss
  mode: min
  patience: 8
  min_delta: 1.0e-4

tensorboard: true
save_config: true

dataloader:
  num_workers: 0
  pin_memory: false
  augmentation:
    rotation_enabled: true
    noise_std: [0.05, 1000.0, 1.0, 1.0, 2.0]

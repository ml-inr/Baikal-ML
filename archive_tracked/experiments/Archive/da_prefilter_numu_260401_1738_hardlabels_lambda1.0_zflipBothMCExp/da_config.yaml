data:
  device: cuda:1
  max_hits: 500
  normalization:
    enabled: true
  source_domain:
    max_events: 600000
    npy_dir: /home2/albert/Baikal/datasets/baikal_mc2020_prefilter/hard_nu_labels
    train_split: 0.85
  target_domain:
    h5_path: /home/albert/Baikal2025/data_manager/data/h5datasets/exp.h5
    max_events: 300000
    train_split: 0.85
dataloader:
  augmentation:
    noise_std:
    - 0.05
    - 5.0
    - 1.0
    - 1.0
    - 2.0
    rotation_enabled: true
  num_workers: 0
  pin_memory: false
debug:
  enabled: false
  max_batches_per_epoch: 10
domain_adaptation:
  domain_discriminator:
    dropout: 0.0
    hidden_dims:
    - 32
    - 16
    lambda_factor: 0.0
    use_batch_norm: false
    use_gradient_reversal: true
  lambda_scheduler:
    gamma: 10.0
    max_lambda: 1.0
    schedule_by: step
    type: progressive
experiment:
  description: Domain adaptation, hard labels NPY source and exp.h5 target
  name: da_prefilter_numu_260401_1738_hardlabels_lambda1.0_zflipBothMCExp
  seed: 42
logging:
  level: INFO
  log_every: 10
  output_dir: experiments/numu
  save_config: true
  save_model_summary: true
  tensorboard: true
model:
  classifier:
    dropout: 0.0
    hidden_dims:
    - 32
    - 16
    use_batch_norm: false
  feature_extractor:
    d_model: 64
    dim_feedforward: 64
    dropout: 0.0
    input_dim: 5
    max_seq_len: 1000
    num_heads: 4
    num_layers: 2
    pooling: cls
    use_positional_encoding: true
  type: numu
reproducibility:
  benchmark: false
  deterministic: true
training:
  class_weights: null
  classifier_optimizer:
    learning_rate: 0.001
    optimizer: adamw
    weight_decay: 0.01
  discriminator_optimizer:
    learning_rate: 0.002
    optimizer: adamw
    weight_decay: 0.01
  early_stopping:
    enabled: true
    min_delta: 0.0001
    mode: max
    monitor: val_auc
    patience: 15
  epochs: 100
  feature_optimizer:
    learning_rate: 0.001
    optimizer: adamw
    weight_decay: 0.01
  loss: bce_with_logits
  save_every: 5
  scheduler: cosine
  scheduler_params:
    T_max: 100
    eta_min: 1e-6
  source_batch_size: 512
  target_batch_size: 256
  validate_every: 1
